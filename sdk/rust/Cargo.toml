[package]
name = "ligetron"
version = "1.7.0"
edition = "2021"

[dependencies]
paste = "1.0.15"
lazy_static = "1.4"

[profile.release]
strip = true  # Automatically strip symbols from the binary.
opt-level = "z"
lto = true
panic = "abort"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

# Set example names
[[example]]
name = "edit_distance"
path = "examples/edit_distance/edit_distance.rs"

[[example]]
name = "sha256"
path = "examples/sha256/sha256.rs"

[[example]]
name = "poseidon_2to1"
path = "examples/poseidon/poseidon_2to1.rs"

[[example]]
name = "poseidon_4to1"
path = "examples/poseidon/poseidon_4to1.rs"

[[example]]
name = "poseidon_batch_2to1"
path = "examples/poseidon/poseidon_batch_2to1.rs"

[[example]]
name = "poseidon_batch_4to1"
path = "examples/poseidon/poseidon_batch_4to1.rs"

[[example]]
name = "poseidon2"
path = "examples/poseidon2/poseidon2_bytes.rs"

[[example]]
name = "poseidon2_batch"
path = "examples/poseidon2/poseidon2_bytes_batch.rs"

[[example]]
name = "eddsa"
path = "examples/eddsa/eddsa_verify_no_args.rs"

[[example]]
name = "eddsa_batch"
path = "examples/eddsa/eddsa_batch_verify_no_args.rs"

[[example]]
name = "ed25519_verify"
path = "examples/eddsa/ed25519_sigver.rs"

[[example]]
name = "ecdsa_p256_verify"
path = "examples/ecdsa/p256_sha256_sigver.rs"

[[example]]
name = "ecdsa_secp256k1_verify"
path = "examples/ecdsa/secp256k1_sha256_sigver.rs"

[[example]]
name = "eth_address_verify"
path = "examples/keccak256/eth_address_verify.rs"

[[example]]
name = "sha512"
path = "examples/sha512/sha512.rs"

# ---- VM test programs -------------------------------------------------------
# These are wasm binaries run under the Ligetron VM (see tests_wasm/run.sh), not
# `cargo test` units. `required-features` keeps a plain `cargo build` building only
# the library, so no existing consumer pays for them.

[features]
default = []
vm-tests = []
fault-injection = []

[[bin]]
name = "bn254fr_bigint_test"
path = "tests_wasm/bn254fr_bigint_test.rs"
required-features = ["vm-tests"]

